services:
  # 1. NestJS Backend API
  - type: web
    name: rangoli-api-staging
    env: node
    plan: starter
    branch: development
    rootDir: .
    buildCommand: npm install && npm run build:packages && npm run prisma:generate && npm run build:api
    startCommand: node apps/api/dist/main
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://rangoli-storefront-staging.onrender.com,https://rangoli-admin-staging.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # 2. Customer Storefront
  - type: web
    name: rangoli-storefront-staging
    env: node
    plan: starter
    branch: development
    rootDir: .
    buildCommand: npm install && npm run build:packages && npm run build:storefront
    startCommand: npm run start --workspace=@rangoli/storefront
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://rangoli-api-staging.onrender.com/api/v1
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false

  # 3. Admin Console
  - type: web
    name: rangoli-admin-staging
    env: node
    plan: starter
    branch: development
    rootDir: .
    buildCommand: npm install && npm run build:packages && npm run build:admin
    startCommand: npm run start --workspace=@rangoli/admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://rangoli-api-staging.onrender.com/api/v1
